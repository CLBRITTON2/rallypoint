[package]
name = "rallypoint"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Saves the GlazeWM session so a reboot can bring every workspace and window back"
repository = "https://github.com/CLBRITTON2/rallypoint"
readme = "README.md"
keywords = ["glazewm", "windows", "session", "restore"]
categories = ["command-line-utilities"]

[dependencies]
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.21"
tungstenite = "0.30.0"
windows = { version = "0.62.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
wmi = "0.18.4"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
embed-resource = "3.0.11"
