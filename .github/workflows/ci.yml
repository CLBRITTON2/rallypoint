name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/lint.ps1
        shell: pwsh

  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/unit-tests.ps1
        shell: pwsh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, unit-tests]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/release.ps1 -Tag $env:TAG -Token $env:TOKEN
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
